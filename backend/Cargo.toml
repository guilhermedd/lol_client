[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.37"
wmi = "0.14"
base64 = "0.23.1"
reqwest = { version = "0.12", features = ["json"] }